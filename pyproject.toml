[project]
name = "sherd-merge"
version = "0.1.0"
description = "土器破片 表裏スキャン統合パイプライン"
requires-python = ">=3.10"
dependencies = [
    "open3d>=0.18",
    "numpy>=1.24",
    "scipy>=1.10",
    "trimesh>=4.0",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sherd-merge = "sherd_merge.pipeline:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
